apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
  namespace: mysql
  labels:
    app: mysql
    component: db
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS todoapp CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    GRANT ALL PRIVILEGES ON todoapp.* TO 'todo_user'@'%';
    FLUSH PRIVILEGES;