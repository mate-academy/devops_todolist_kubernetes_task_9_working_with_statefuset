apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
        - name: todoapp
          image: ikulyk404/todoapp:3.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: app-db-secret
                  key: NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-db-secret
                  key: USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-secret
                  key: PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: app-db-secret
                  key: HOST
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "300m"
