apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: mysql
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS app_db;
    
    USE app_db;
    
    CREATE TABLE IF NOT EXISTS counter (
        id INT AUTO_INCREMENT PRIMARY KEY,
        value INT
    );
    
    GRANT ALL PRIVILEGES ON app_db.* TO 'muser'@'%';
    FLUSH PRIVILEGES;
