apiVersion: v1
kind: ConfigMap
metadata:
 name: mysql-config
 namespace: mysql
 labels:
   app: mysql
data:
 init.sql: |
   GRANT ALL PRIVILEGES ON app_db.* TO 'app_user'@'%';
   FLUSH PRIVILEGES;
   USE app_db;
   CREATE TABLE counter (
       id INT AUTO_INCREMENT PRIMARY KEY,
       value INT
   );
