apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  serviceName: mysql
  replicas: 3
  template:
    metadata:
      labels:
        app: mysql
    spec:
        containers:
          - name: mysql
            image: mysql:8.0
            env:
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MYSQL_ROOT_PASSWORD
                  name: mysql-secret
            - name: USER
              valueFrom:
                secretKeyRef:
                  key: MYSQL_USER
                  name: mysql-secret
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MYSQL_PASSWORD
                  name: mysql-secret
            - name: NAME
              valueFrom:
                secretKeyRef:
                  key: MYSQL_DATABASE
                  name: mysql-secret
            - name: PORT
              valueFrom:
                secretKeyRef:
                  key: MYSQL_PORT
                  name: mysql-secret
            - name: HOST
              valueFrom:
                secretKeyRef:
                  key: MYSQL_HOST
                  name: mysql-secret
            ports:
              - name: mysql
                containerPort: 3306
            volumeMounts:
              - mountPath: /var/lib/mysql
                name: data
              - mountPath: /docker-entrypoint-initdb.d
                name: mysql-config
            resources:
              requests:
                cpu: 300m
                memory: 1Gi
              limits:
                cpu: 700m
                memory: 2Gi
            livenessProbe:
              exec:
                command: ["mysqladmin", "ping"]
              initialDelaySeconds: 30
              periodSeconds: 5
              timeoutSeconds: 3
            readinessProbe:
              exec:
                command: [ "mysqladmin", "ping" ]
              initialDelaySeconds: 5
              periodSeconds: 3
              timeoutSeconds: 2
        volumes:
          - name: mysql-config
            configMap:
              name: mysql-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 3Gi

