apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: mysql
spec: 
  serviceName: mysql
  replicas: 3
  selector:
    matchLabels: 
      app: mysql
  template:
    metadata: 
      labels:
         app: mysql
    spec:
      containers: 
        - name: mysql
          image: mysql:8
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: 
                  name: mysql-secret 
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: 
                  name: mysql-secret 
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
          readinessProbe:
            exec:
              command: ['mysqladmin', 'ping']
            initialDelaySeconds: 5
          livenessProbe:
            exec:
              command: ['mysqladmin', 'ping']
            initialDelaySeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1024Mi"
              cpu: "600m"
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql
            - mountPath: /docker-entrypoint-initdb.d
              name: mysql-data
            
      volumes:
        - name: mysql-data
          configMap:
            name: mysql-data
  volumeClaimTemplates:
    - metadata:
        name: mysql
      spec:
        storageClassName: standard
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    




