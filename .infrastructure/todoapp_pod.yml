apiVersion: v1
kind: Pod
metadata:
  name: todoapp-standalone-pod
  namespace: todoapp
  labels:
    app: todoapp
spec:
  containers:
  - name: todoapp
    image: ikulyk404/todoapp:3.0.0
    env:
    - name: DB_NAME
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: NAME
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: USER
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: PASSWORD
    - name: DB_HOST
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: HOST
    ports:
    - containerPort: 8080