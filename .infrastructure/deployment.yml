apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
  namespace: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
      - name: todoapp
        image: ikulyk404/todoapp:3.0.0
        env:
        - name: NAME
          value: ShopDB
        - name: USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
        - name: HOST
          value: mysql-0.mysql.mysql.svc.cluster.local
        ports:
        - containerPort: 8080
