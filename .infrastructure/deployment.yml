apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
  namespace: todoapp
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
      - name: todoapp
        image: todoapp:task9
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        args:
        - |
          until python manage.py migrate --noinput; do
            echo "MySQL is not ready yet; retrying in 5 seconds..."
            sleep 5
          done
          exec python manage.py runserver 0.0.0.0:8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "256Mi"
            cpu: "150m"
        env:
        - name: PYTHONUNBUFFERED
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PYTHONUNBUFFERED
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: SECRET_KEY
        - name: NAME
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: NAME
        - name: USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: USER
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: PASSWORD
        - name: HOST
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: HOST
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /api/health
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
