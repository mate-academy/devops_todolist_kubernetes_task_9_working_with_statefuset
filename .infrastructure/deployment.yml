apiVersion: v1
kind: Secret
metadata:
  name: app-db-secret
  namespace: default
type: Opaque
data:
  NAME: dG9kb2xpc3Q=
  USER: dG9kb3VzZXI=
  PASSWORD: dG9kb3Bhc3MxMjM=
  HOST: bXlzcWwtMC5teXNxbC1oZWFkbGVzcy5teXNxbC5zdmMuY2x1c3Rlci5sb2NhbA==
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todolist-app
  template:
    metadata:
      labels:
        app: todolist-app
    spec:
      containers:
      - name: todolist-app
        image: python:3.9-slim
        ports:
        - containerPort: 8000
        env:
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: app-db-secret
              key: NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-db-secret
              key: USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-db-secret
              key: PASSWORD
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: app-db-secret
              key: HOST