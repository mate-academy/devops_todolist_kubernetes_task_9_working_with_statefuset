
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
  namespace: todoapp

spec:
  replicas: 1
  selector:
    matchLabels:
      app: todoapp

  template:
    metadata:
      labels:
        app: todoapp

    spec:
      containers:
        - name: todoapp
          image: todoapp:task9
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: SECRET_KEY

            - name: NAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: NAME

            - name: USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: USER

            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: PASSWORD

            - name: HOST
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: HOST

          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
