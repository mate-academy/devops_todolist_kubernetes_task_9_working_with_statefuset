apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: mysql
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS;  
    GRANT ALL PRIVILEGES ON app_db.* TO 'mysqluser'@'%';
    USE app_db;
    CREATE TABLE todo (
    id INT AUTO_INCREMENT PRIMARY KEY,
    value VARCHAR(255)
    );